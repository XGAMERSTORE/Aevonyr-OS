name: Bookish OS ARM64 userspace (Pi 4 research)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.arm64'
      - '.github/workflows/bookish-arm64-userspace.yml'
      - 'aevonyr/**'
      - 'bookish/**'
      - 'language-packs/**'
  pull_request:
    paths:
      - 'Dockerfile.arm64'
      - '.github/workflows/bookish-arm64-userspace.yml'
      - 'aevonyr/**'
      - 'bookish/**'
      - 'language-packs/**'
permissions:
  contents: read
jobs:
  arm64-userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 Debian userspace
        run: docker buildx build --platform linux/arm64 --load -f Dockerfile.arm64 -t bookish-arm64:ci .
      - name: Verify architecture and Bookish CLI under emulation
        run: |
          set -euo pipefail
          test "$(docker image inspect bookish-arm64:ci --format '{{.Architecture}}')" = arm64
          docker run --rm --platform linux/arm64 bookish-arm64:ci uname -m | grep -qx aarch64
          docker run --rm --platform linux/arm64 bookish-arm64:ci python3 -m compileall -q aevonyr bookish
          docker run --rm --platform linux/arm64 bookish-arm64:ci python3 -m bookish --languages
