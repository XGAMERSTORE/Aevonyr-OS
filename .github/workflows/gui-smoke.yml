name: Aevonyr GUI smoke (Xvfb)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/aevonyr-1.0-gui-validation
      - feature/aevonyr-orbit-desktop
    paths:
      - 'aevonyr/**'
      - 'tests/**'
      - 'iso/**'
      - '.github/workflows/gui-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install headless X11 and Tk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk python3-pil xvfb xauth
      - name: Python unit tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q aevonyr
          node tests/orbit_layout.test.cjs
      - name: Open real Aevonyr GUI and exercise pages
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/gui_smoke.py
      - name: Orbit keyboard and search smoke with screenshots
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" python3 tests/orbit_gui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aevonyr-orbit-ui-preview
          path: dist/orbit-*.png
          if-no-files-found: warn
          retention-days: 14
